name: Frontend Auth Runtime Tests

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-auth-runtime-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-auth-runtime-tests.yml'

permissions:
  contents: read

jobs:
  frontend-auth-runtime:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run auth runtime regression tests
        run: npm run test:auth-runtime

      - name: Run Galaxy foundation regression tests
        run: npm run test:galaxy

      - name: Run homepage DOM regression tests
        run: npm run test:homepage

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
