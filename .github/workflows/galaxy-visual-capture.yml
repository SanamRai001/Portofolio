name: Galaxy Visual Capture

on:
  push:
    branches:
      - feat/galaxy-cinematic-surface-spike
      - feat/galaxy-cinematic-realism
    paths:
      - 'frontend/**'
      - '.github/workflows/galaxy-visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install temporary browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture Galaxy
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/capture-galaxy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-visual-${{ github.sha }}
          path: frontend/artifacts/galaxy-visual/
          if-no-files-found: warn
          retention-days: 7
