name: Diagnose Live Demo Credentials

on:
  push:
    branches:
      - security/password-migration-check
    paths:
      - '.github/workflows/diagnose-live-demo-credentials.yml'

permissions:
  contents: read

jobs:
  diagnose-demo-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test known public demo credential variants
        shell: bash
        env:
          API_BASE: https://portofolio-zsky.onrender.com
        run: |
          set -euo pipefail

          test_login() {
            local LABEL="$1"
            local EMAIL="$2"
            local PASSWORD="$3"
            local RESPONSE_FILE
            RESPONSE_FILE="$(mktemp)"

            local HTTP_CODE
            HTTP_CODE="$(
              curl -sS                 --connect-timeout 15                 --max-time 45                 -o "$RESPONSE_FILE"                 -w "%{http_code}"                 -H "Content-Type: application/json"                 --data "$(jq -nc --arg email "$EMAIL" --arg password "$PASSWORD" '{email:$email,password:$password}')"                 "$API_BASE/api/auth/login" || true
            )"

            local SUCCESS AUTH_VERSION HAS_TOKEN
            SUCCESS="$(jq -r '.success // false' "$RESPONSE_FILE" 2>/dev/null || true)"
            AUTH_VERSION="$(jq -r '.authVersion // empty' "$RESPONSE_FILE" 2>/dev/null || true)"
            HAS_TOKEN="$(jq -r 'if (.token | type) == "string" and (.token | length) > 0 then "true" else "false" end' "$RESPONSE_FILE" 2>/dev/null || echo false)"
            rm -f "$RESPONSE_FILE"

            echo "$LABEL: HTTP=$HTTP_CODE success=$SUCCESS token=$HAS_TOKEN authVersion=${AUTH_VERSION:-none}"

            if [ "$HTTP_CODE" = "200" ] && [ "$SUCCESS" = "true" ] && [ "$HAS_TOKEN" = "true" ]; then
              return 0
            fi

            return 1
          }

          FOUND=false

          if test_login "lowercase-displayed-email" "viewer@gmail.com" "Viewer@123#"; then
            FOUND=true
          fi

          if test_login "repository-seed-viewer" "viewer@portfolio.dev" "viewer123"; then
            FOUND=true
          fi

          if [ "$FOUND" != "true" ]; then
            echo "::error::None of the known public viewer credential variants can log in."
            exit 1
          fi
