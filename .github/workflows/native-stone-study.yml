name: Native Blender Stone Study
on:
  push:
    branches: [experiment/native-blender-stone-20261124]
    paths:
      - 'prototypes/native-stone-study/**'
      - '.github/workflows/native-stone-study.yml'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version
      - name: Build real stone geometry and render
        run: |
          mkdir -p artifacts/native-stone
          blender -b -t 4 --python-exit-code 1 --python prototypes/native-stone-study/build.py -- "$PWD/artifacts/native-stone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stone-study
          path: |
            artifacts/native-stone/*.glb
            artifacts/native-stone/*.blend
            artifacts/native-stone/*.png
            artifacts/native-stone/manifest.json
          if-no-files-found: warn
          retention-days: 7
