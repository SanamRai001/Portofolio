name: Password Migration Dry Run

on:
  push:
    branches:
      - security/password-migration-check
    paths:
      - '.github/workflows/password-migration-check.yml'
      - 'backend/**'

permissions:
  contents: read

jobs:
  password-migration-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      DB_URI: ${{ secrets.DB_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify DB_URI is configured
        shell: bash
        run: |
          if [ -z "$DB_URI" ]; then
            echo "::error::DB_URI repository secret is not configured."
            exit 1
          fi
          echo "DB_URI is configured."

      - name: Install backend dependencies
        run: npm ci

      - name: Run password migration dry-run
        run: npm run migrate:passwords
