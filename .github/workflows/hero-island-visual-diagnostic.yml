name: Hero Island Visual Diagnostic
# rerun after production hero fix

on:
  push:
    branches:
      - diagnostic/hero-island-visual
    paths:
      - '.github/workflows/hero-island-visual-diagnostic.yml'

permissions:
  contents: read

jobs:
  capture-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create Playwright diagnostic
        shell: bash
        run: |
          mkdir -p /tmp/hero-check
          cd /tmp/hero-check
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null 2>&1

          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 })

          const consoleErrors = []
          const pageErrors = []

          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(msg.text())
          })
          page.on('pageerror', err => pageErrors.push(err.message))

          await page.goto('https://sanam-rai.com.np/', { waitUntil: 'networkidle', timeout: 120000 })
          await page.screenshot({ path: 'before-login.png', fullPage: false })

          const authVisible = await page.locator('.AuthOverlay').count()

          if (authVisible) {
            await page.locator('#viewer-email').fill('viewer@portfolio.dev')
            await page.locator('#viewer-password').fill('viewer123')
            await Promise.all([
              page.waitForLoadState('networkidle').catch(() => {}),
              page.getByRole('button', { name: /login to backend lab/i }).click(),
            ])
            await page.waitForTimeout(4000)
          }

          await page.locator('.HeroPanel').scrollIntoViewIfNeeded()
          await page.waitForTimeout(2500)

          const diagnostics = await page.evaluate(() => {
            const island = document.querySelector('.HeroIsland')
            const stage = document.querySelector('.HeroIslandStage')
            const mount = document.querySelector('.HeroIslandCanvas')
            const canvas = document.querySelector('.HeroIslandCanvas canvas')
            const fallback = document.querySelector('.HeroIslandFallback')

            const rect = el => {
              if (!el) return null
              const r = el.getBoundingClientRect()
              return { x:r.x, y:r.y, width:r.width, height:r.height }
            }

            return {
              href: location.href,
              authOverlay: Boolean(document.querySelector('.AuthOverlay')),
              islandClass: island?.className ?? null,
              islandRect: rect(island),
              stageRect: rect(stage),
              mountRect: rect(mount),
              canvasRect: rect(canvas),
              canvasPixelSize: canvas ? { width: canvas.width, height: canvas.height } : null,
              fallbackDisplay: fallback ? getComputedStyle(fallback).display : null,
              islandBackground: island ? getComputedStyle(island).backgroundImage : null,
              heroText: document.querySelector('.HeroPanelNote')?.textContent?.trim() ?? null,
            }
          })

          await page.locator('.HeroPanel').screenshot({ path: 'hero-panel.png' })
          await page.screenshot({ path: 'after-login.png', fullPage: false })

          fs.writeFileSync('diagnostics.json', JSON.stringify({
            diagnostics,
            consoleErrors,
            pageErrors,
          }, null, 2))

          console.log(JSON.stringify({ diagnostics, consoleErrors, pageErrors }, null, 2))
          await browser.close()
          EOF

          node check.mjs

      - name: Upload hero diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: hero-island-visual
          path: |
            /tmp/hero-check/before-login.png
            /tmp/hero-check/after-login.png
            /tmp/hero-check/hero-panel.png
            /tmp/hero-check/diagnostics.json
          retention-days: 2
